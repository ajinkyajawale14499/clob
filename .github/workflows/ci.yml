name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    # Uses Release deps (Conan-Center pre-builts) + ASan/UBSan flags on our
    # own code only — see asan-fast preset. Cold cache run: ~3 min. Cached: ~2 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install g++-13 (matches Conan-Center Release pre-built ABI)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          g++ --version | head -1
          cmake --version | head -1

      # Why gcc-13 not gcc-14: Conan-Center Release pre-builts target
      # gcc-11/12/13. gcc-14 forces source builds. The code itself only needs
      # C++23 features that work on gcc-13 (std::format, <=>, basic ranges).
      # Pre-builts only exist for Release; we use the asan-fast preset which
      # links Release deps but compiles OUR code with -fsanitize=address,undefined.
      # Standard ASan-in-CI pattern: instrument first-party code only.
      - name: Enforce minimum compiler version
        run: |
          gxx_major=$(g++ -dumpversion | cut -d. -f1)
          if [ "$gxx_major" -lt 13 ]; then
            echo "::error::g++ $gxx_major < 13 — plan requires gcc 13+ / clang 17+"
            exit 1
          fi

      - name: Convention check — core does not link io
        run: |
          if grep -rn '#include[[:space:]]*"io/' core/; then
            echo "::error::core/ must not #include io/ headers (architectural boundary)"
            exit 1
          fi
          if grep -rnE '(clob_journal|clob::journal|clob_log|clob::log)' core/; then
            echo "::error::core/ must not link io targets"
            exit 1
          fi
          echo "OK: core/ has no io/ dependency"

      - name: Determinism audit — engine has no wall-clock / PRNG / unordered iteration (ADR 0001)
        run: |
          if grep -rnE '\b(system_clock|steady_clock|high_resolution_clock|clock_gettime|gettimeofday|localtime|gmtime|mktime)\b' core/matching core/orderbook; then
            echo "::error::core/matching|orderbook must not read wall-clock (ADR 0001 D1)"
            exit 1
          fi
          if grep -rnE '\b::time[[:space:]]*\(' core/matching core/orderbook; then
            echo "::error::core/matching|orderbook must not call ::time() (ADR 0001 D1)"
            exit 1
          fi
          if grep -rnE '\b(random_device|mt19937|default_random_engine|arc4random)\b|/dev/urandom' core/matching core/orderbook; then
            echo "::error::core/matching|orderbook must not use a PRNG (ADR 0001 D3)"
            exit 1
          fi
          if grep -rnE '\b::rand[[:space:]]*\(' core/matching core/orderbook; then
            echo "::error::core/matching|orderbook must not call ::rand() (ADR 0001 D3)"
            exit 1
          fi
          if grep -rnE 'id_index_\.(begin|cbegin|rbegin)\(\)' core/; then
            echo "::error::core/ must not iterate id_index_ (unordered iteration order, ADR 0001 D2)"
            exit 1
          fi
          echo "OK: ADR 0001 determinism invariants hold"

      - name: Install Conan
        run: |
          pipx install conan
          conan --version
          conan profile detect --force

      # Cache the Conan package store (~/.conan2/p) so any from-source builds
      # don't repeat. With Release deps + asan-fast preset there should be
      # nothing to build — Conan-Center pre-builts cover everything.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc13-release-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-gcc13-release-

      # Release deps (pre-built) — ASan/UBSan flags are applied to OUR code
      # only via the asan-fast preset. Standard industry pattern for
      # sanitized-CI; we don't need third-party libs to be instrumented.
      - name: Conan install (Release deps)
        run: conan install . -s build_type=Release --build=missing

      - name: Configure (asan-fast preset — Release deps + ASan on our code)
        run: cmake --preset asan-fast

      - name: Build
        run: cmake --build build/Release --parallel

      - name: Test
        run: ctest --preset asan-fast --output-on-failure
