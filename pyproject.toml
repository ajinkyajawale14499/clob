[project]
name = "clob"
version = "0.1.0"
description = "ML execution stack on order-book data"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.21,<2",     # pinned >=1.21 for stable rolling_*_by API
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyter>=1.1",
    "matplotlib>=3.9",     # used in exploration notebook
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
markers = [
    "data: requires real LOBSTER/Binance CSVs in data/raw/ — skipped in CI",
]
