[project]
name = "clob"
version = "0.1.0"
description = "ML execution stack on order-book data"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.21,<2",     # pinned >=1.21 for stable rolling_*_by API
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "numpy>=2.0",
    "lightgbm>=4.6.0",
    "onnxmltools>=1.16.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.26.0",
    "scikit-learn>=1.8.0",
    "hypothesis>=6.152.7",
    "pytest-benchmark>=5.2.3",
    "onnxconverter-common>=1.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyter>=1.1",
    "matplotlib>=3.9",     # used in exploration notebook
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Research scripts are reference material, not maintained production code.
extend-exclude = ["docs/research/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# microprice_g.py uses uppercase variable names (P, R, G) matching Stoikov 2018
# mathematical notation. Renaming would obscure the algorithm.
"model/microprice_g.py" = ["N806"]
# train.py uses sklearn convention `X` for feature matrices and derivatives
# (X_bal, Xtr_pool, Xva). Renaming would break the dominant ML convention.
"model/train.py" = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
markers = [
    "data: requires real LOBSTER/Binance CSVs in data/raw/ — skipped in CI",
]
